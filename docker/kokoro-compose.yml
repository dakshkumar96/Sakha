# Kokoro-FastAPI — TTS sidecar for Krishna AI
# https://github.com/remsky/Kokoro-FastAPI
#
# Usage:
#   docker compose -f docker/kokoro-compose.yml up -d
#   open http://localhost:8880/web

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: krishna-kokoro-tts
    ports:
      - "8880:8880"
    restart: unless-stopped
    # NVIDIA GPU alternative (uncomment + swap image):
